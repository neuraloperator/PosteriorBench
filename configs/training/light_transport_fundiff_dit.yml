stage: "dit"
dataset: "light_transport"
data: "hf_reference_materialized/PDEFieldDataset_hf/LTMI_Multimode"
package_dir: "artifacts/checkpoints/fundiff/light_transport_fundiff"
outdir: "exps"
target_channels: ["sigma_t1", "sigma_t2"]
condition_channels: ["u"]
resolution: 64
observation_operator: "area_average"
num_sensors: 0
condition_low_resolution: 16
target_normalization:
  channels: ["sigma_t1", "sigma_t2"]
  mean: [2.5167187795048154, 2.517986240638265]
  std: [1.756092760094968, 1.7550055063328003]
  scale: 0.5
condition_normalization:
  channels: ["u"]
  mean: [0.3229744808981993]
  std: [0.13083477812502864]
  scale: 0.5
model:
  target_encoder: &encoder
    patch_size: [8, 8]
    grid_size: [64, 64]
    emb_dim: 256
    num_latents: 64
    depth: 8
    num_heads: 8
    mlp_ratio: 2
  target_decoder:
    fourier_freq: 10.0
    period: false
    dec_depth: 4
    dec_num_heads: 8
    dec_emb_dim: 256
    mlp_ratio: 2
    out_dim: 2
    num_mlp_layers: 2
  condition_encoder: *encoder
  condition_decoder:
    fourier_freq: 10.0
    period: false
    dec_depth: 4
    dec_num_heads: 8
    dec_emb_dim: 256
    mlp_ratio: 2
    out_dim: 1
    num_mlp_layers: 2
  dit:
    model_name: "DiT"
    emb_dim: 384
    depth: 16
    num_heads: 8
    mlp_ratio: 2.0
    out_dim: 256
batch: 128
num_queries: 256
input_downsample_factors: [1]
max_steps: 117188
lr:
  init_value: 0.0
  peak_value: 1.0e-3
  warmup_steps: 2000
  transition_steps: 5000
  decay_rate: 0.9
optim:
  weight_decay: 1.0e-5
  clip_norm: 1.0
log_interval: 50
save_interval: 1000
seed: 20260627
dry_run: false
wandb: "online"
name: "light-transport-fundiff-dit"
