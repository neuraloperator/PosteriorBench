stage: "condition_fae"
dataset: "poisson"
data: "hf_reference_materialized/PDEFieldDataset_hf/Poisson_Multimode"
package_dir: "artifacts/checkpoints/fundiff/poisson_fundiff"
outdir: "exps"
target_channels: ["f"]
condition_channels: ["phi"]
resolution: 128
observation_operator: "sparse_points"
num_sensors: 128
condition_low_resolution: null
target_normalization:
  channels: ["f"]
  mean: [-5.112124255024497e-12]
  std: [0.2719037491997419]
  scale: 0.5
condition_normalization:
  channels: ["phi"]
  mean: [6.660705921767242e-06]
  std: [0.003855847254279942]
  scale: 0.5
model:
  target_encoder:
    patch_size: [16, 16]
    grid_size: [128, 128]
    emb_dim: 256
    num_latents: 64
    depth: 8
    num_heads: 8
    mlp_ratio: 2
  target_decoder:
    fourier_freq: 10.0
    period: false
    dec_depth: 4
    dec_num_heads: 8
    dec_emb_dim: 256
    mlp_ratio: 2
    out_dim: 1
    num_mlp_layers: 2
  condition_encoder:
    patch_size: [16, 16]
    grid_size: [128, 128]
    emb_dim: 256
    num_latents: 64
    depth: 8
    num_heads: 8
    mlp_ratio: 2
  condition_decoder:
    fourier_freq: 10.0
    period: false
    dec_depth: 4
    dec_num_heads: 8
    dec_emb_dim: 256
    mlp_ratio: 2
    out_dim: 1
    num_mlp_layers: 2
  dit:
    model_name: "DiT"
    emb_dim: 256
    depth: 8
    num_heads: 8
    mlp_ratio: 2.0
    out_dim: 256
batch: 16
num_queries: 4096
input_downsample_factors: [1]
max_steps: 100000
lr:
  init_value: 0.0
  peak_value: 1.0e-3
  warmup_steps: 2000
  transition_steps: 2000
  decay_rate: 0.9
optim:
  weight_decay: 1.0e-5
  clip_norm: 1.0
log_interval: 50
save_interval: 1000
seed: 20260627
dry_run: false
wandb: "online"
name: "poisson-fundiff-condition-fae"
