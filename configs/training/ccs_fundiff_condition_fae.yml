stage: "condition_fae"
dataset: "ccs"
data: "hf_reference_materialized/PDEFieldDataset_hf/CCS_Multimode"
package_dir: "artifacts/checkpoints/fundiff/ccs_fundiff"
outdir: "exps"
target_channels: ["x"]
condition_channels: ["y"]
resolution: [64, 200]
observation_operator: "sparse_points"
num_sensors: 128
sensor_columns: [0, 50]
condition_low_resolution: null
target_normalization:
  channels: ["x"]
  mean: [248.86085613126085]
  std: [212.11948744691105]
  scale: 0.5
condition_normalization:
  channels: ["y"]
  mean: [0.08489088577079608]
  std: [0.21714609039354066]
  scale: 0.5
model:
  target_encoder: &encoder
    patch_size: [8, 25]
    grid_size: [64, 200]
    emb_dim: 256
    num_latents: 64
    depth: 8
    num_heads: 8
    mlp_ratio: 2
  target_decoder:
    fourier_freq: 10.0
    period: false
    dec_depth: 4
    dec_num_heads: 8
    dec_emb_dim: 256
    mlp_ratio: 2
    out_dim: 1
    num_mlp_layers: 2
  condition_encoder: *encoder
  condition_decoder:
    fourier_freq: 10.0
    period: false
    dec_depth: 4
    dec_num_heads: 8
    dec_emb_dim: 256
    mlp_ratio: 2
    out_dim: 1
    num_mlp_layers: 2
  dit:
    model_name: "DiT"
    emb_dim: 256
    depth: 8
    num_heads: 8
    mlp_ratio: 2.0
    out_dim: 256
batch: 16
num_queries: 4096
input_downsample_factors: [1, 2, 4]
max_steps: 100000
lr:
  init_value: 0.0
  peak_value: 1.0e-3
  warmup_steps: 2000
  transition_steps: 2000
  decay_rate: 0.9
optim:
  weight_decay: 1.0e-5
  clip_norm: 1.0
log_interval: 50
save_interval: 1000
seed: 20260627
dry_run: false
wandb: "online"
name: "ccs-fundiff-condition-fae"
