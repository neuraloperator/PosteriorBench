# Canonical ECI joint-state FFM prior for Light Transport.
outdir: "exps"
data: "hf_reference_materialized/PDEFieldDataset_hf/LTMI_Multimode"
resolution: 64
normalization_scale: 0.5
max_steps: 58594
batch: 256
lr: 3.0e-4
weight_decay: 0.0
beta1: 0.9
beta2: 0.999
model_config:
  backbone: "fno"
  n_modes: [32, 32]
  emb_channels: 32
  hidden_channels: 128
  n_layers: 6
  lifting_channel_ratio: 4
  projection_channel_ratio: 4
  domain_padding: 0.1
  domain_padding_mode: "one-sided"
  base_noise: "matern"
  kernel_length: 0.001
  kernel_variance: 1.0
fp16: false
tf32: false
workers: 8
max_size: null
shuffle_subset: false
log_freq: 50
save_freq: 2000
snapshot_freq: 2000
seed: 20260623
device: "cuda"
resume: null
dry_run: false
wandb: "online"
name: "__required__"
