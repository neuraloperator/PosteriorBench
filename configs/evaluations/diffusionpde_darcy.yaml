method: diffusionpde
dataset: darcy

model:
  channels: [a, u]
  resolution: 128

normalization:
  channels: [a, u]
  mean: [7.504105799560547, 0.005674326580818473]
  std: [4.4999981269340505, 0.003775836434409684]
  scale: 0.5

sampling:
  init_latents: gaussian
  iterations: 2000
  sigma_min: 0.002
  sigma_max: 80.0
  rho: 7.0

guidance:
  pending: false
  loss_type: l2
  normalize: false
  schedule:
    observation_fraction: 0.8
    late_observation_scale: 0.1
  field_weights:
    u: 40000.0
  pde_weight: 0.0

postprocess:
  discrete_values:
    a: [3.0, 12.0]
