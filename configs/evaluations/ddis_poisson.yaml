method: ddis
dataset: poisson
model:
  channels: [f]
  resolution: 128
normalization:
  channels: [f]
  mean: [-5.112124255024497e-12]
  std: [0.2719037491997419]
  scale: 0.5
sampling:
  init_latents: rbf
  rbf_scale: 0.05
  annealing:
    num_steps: 100
    sigma_max: 10.0
    sigma_min: 0.01
    sigma_final: 0.0
    rho: 7.0
  diffusion:
    num_steps: 5
    sigma_min: 0.001
    sigma_final: 0.0
    rho: 7.0
  langevin:
    num_steps: 35
    lr: 7.0e-5
    lr_min_ratio: 0.01
    lr_rho: 1.0
    eta: 0.25
    tau: 0.001
guidance:
  pending: false
  observed_field: phi
  observation_operator: sparse_points
  loss_type: mse
  normalize: true
  observation_normalization_scale: 0.5
  field_weights:
    phi: 2.0
  surrogate:
    model: fno_pad
    checkpoint: artifacts/checkpoints/ddis_surrogate/poisson_ddis_surrogate.pt
    input_channels: [f]
    output_channels: [phi]
postprocess: {}
