method: esmda
dataset: light_transport
model:
  channels: [sigma_t1, sigma_t2, u]
  resolution: 64
normalization:
  channels: [sigma_t1, sigma_t2, u]
  mean: [2.5167187795048154, 2.517986240638265, 0.3229744808981993]
  std: [1.756092760094968, 1.7550055063328003, 0.13083477812502864]
  scale: 0.5
sampling:
  ensemble_size: 1024
  num_assimilations: 1
  inflation: constant
guidance:
  observed_field: u
  observation_operator: area_average
  observation_error:
    mode: prior_std_fraction
    scale: 1.0
    min_std: 1.0e-6
    jitter: 1.0e-8
postprocess: {}
