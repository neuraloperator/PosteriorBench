method: fundps
dataset: poisson

model:
  channels: [f, phi]
  resolution: 128

normalization:
  channels: [f, phi]
  mean: [-5.112124255024497e-12, 6.660705921767242e-06]
  std: [0.2719037491997419, 0.003855847254279942]
  scale: 0.5

sampling:
  init_latents: rbf
  rbf_scale: 0.05
  iterations: 500
  sigma_min: 0.01
  sigma_max: 10.0
  rho: 7.0

guidance:
  loss_type: mse
  normalize: true
  field_weights:
    f: 0.0
    phi: 1600.0
  pde_weight: 0.0

postprocess: {}
