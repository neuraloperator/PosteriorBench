method: diffusionpde
dataset: poisson

model:
  channels: [f, phi]
  resolution: 128

normalization:
  channels: [f, phi]
  mean: [-5.112124255024497e-12, 6.660705921767242e-06]
  std: [0.2719037491997419, 0.003855847254279942]
  scale: 0.5

sampling:
  init_latents: gaussian
  iterations: 2000
  sigma_min: 0.002
  sigma_max: 80.0
  rho: 7.0

guidance:
  pending: false
  loss_type: l2
  normalize: false
  schedule:
    observation_fraction: 0.8
    late_observation_scale: 0.1
  field_weights:
    phi: 20000.0
  pde_weight: 0.0

postprocess:
  {}
